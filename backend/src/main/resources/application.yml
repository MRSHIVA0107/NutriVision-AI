server:
  port: ${PORT:8080}
  compression:
    enabled: true

spring:
  application:
    name: nutrivision-backend
  servlet:
    multipart:
      enabled: true
      max-file-size: 15MB
      max-request-size: 20MB

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5500,http://localhost:8080,http://127.0.0.1:5500,http://127.0.0.1:8080,https://*.netlify.app,*}
  usda:
    base-url: "https://api.nal.usda.gov/fdc/v1"
    api-key: ${USDA_API_KEY:DEMO_KEY}
    timeout-ms: 10000
  ai:
    provider: ${AI_VISION_PROVIDER:gemini}
    api-key: ${AI_VISION_API_KEY:${GEMINI_API_KEY:}}
    gemini-endpoint: ${GEMINI_API_ENDPOINT:https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent}
    timeout-ms: 15000

management:
  endpoints:
    web:
      exposure:
        include: health,info
